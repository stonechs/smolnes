name: Publish smolnes V3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-release:
    if: ${{ github.event.head_commit.message == 'Publish smolnes V3 release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the V3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3 >/dev/null 2>&1; then
            echo "Release v3 already exists; nothing to publish."
            exit 0
          fi
          gh release create v3 \
            dist/V3/final/smolnes-v3.exe \
            dist/V3/final/smolnes-v3-source.zip \
            dist/V3/final/release-assets-sha256.txt \
            --target "$GITHUB_SHA" \
            --title "smolnes Windows-native V3" \
            --notes-file dist/V3/final/RELEASE_NOTES.md

